<p-toast></p-toast>

<div class="card">
    <h5>Categories</h5>
    <button pButton type="button" icon="pi pi-plus" (click)="onAddClick()"></button>
    <p-table [value]="categories" dataKey="id" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
            <tr>
                <th style="width:25%">number</th>
                <th style="width:25%">Name</th>
                <th style="width:25%">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-line let-i="index">
            <tr>

                <td pEditableColumn>
                    <p-cellEditor>
                        <ng-template pTemplate="output">
                            {{line.id}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td pEditableColumn>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input pInputText type="text" [(ngModel)]="line.name">
                        </ng-template>
                        <ng-template pTemplate="output">
                            {{line.name}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td pEditableColumn>
                    <p-cellEditor>
                        <ng-template pTemplate="output">
                            <button pButton type="button" class="btn btn-danger" icon="pi pi-trash"
                                (click)="onDeleteClick(line)"></button>
                        </ng-template>
                    </p-cellEditor>
                </td>
            </tr>
        </ng-template>
    </p-table>
    <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-primary " (click)="submit()">Submit</button>
        <button class="btn btn-secondary me-2" (click)="cancel()">Cancel</button>
    </div>
</div>
