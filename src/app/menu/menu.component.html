<div class="row">
    <div class="col">
        <div class="btn-group w-100">
            <ng-container *ngFor="let category of categories; let i = index">
                <button class="btn btn-primary flex-grow-1" [style.background-color]="colors[i]" (click)="onCategoryClick(category.id)"> {{category.name}}</button>
            </ng-container>
        </div>
    </div>
</div>
